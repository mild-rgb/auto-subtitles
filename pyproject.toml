[project]
name = "auto-subtitles"
version = "0.1.0"
description = "Automatically add same-language subtitles to a video in any Whisper language: ffmpeg + faster-whisper"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.9.2.10; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9; sys_platform != 'darwin'",
]
